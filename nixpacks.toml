[phases.setup]
nixPkgs = ["python3"]
aptPkgs = ["swaks", "curl", "wget", "perl", "python3-pip", "python3-venv"]

[phases.install]
cmds = [
    "python3 -m venv /opt/venv",
    ". /opt/venv/bin/activate",
    "pip install -r requirements.txt"
]

[phases.build]
cmds = []

[start]
cmd = "/opt/venv/bin/python test.py"
